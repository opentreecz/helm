apiVersion: v2
name: tor-obfs4-bridge
description: >-
  Helm chart for running a Tor obfs4 pluggable-transport bridge on Kubernetes.
  Deploys a StatefulSet with persistent storage, a LoadBalancer Service exposing
  the OR port and PT port, and hardened security defaults (non-root, capability
  drop, seccomp RuntimeDefault).
type: application

# chart version – bumped automatically by the release workflow (auto-bump).
version: 0.1.1

# appVersion is the default container image tag; bump when upgrading Tor.
appVersion: "0.4.9.12-1-d13.trixie-1"

home: https://github.com/zetneteork/docker-tor-obfs4-bridge
sources:
  - https://github.com/zetneteork/docker-tor-obfs4-bridge
  - https://github.com/opentreecz/helm

maintainers:
  - name: opentreecz
    email: tor@opentree.cz

keywords:
  - tor
  - bridge
  - obfs4
  - privacy
  - anonymity
  - pluggable-transport
