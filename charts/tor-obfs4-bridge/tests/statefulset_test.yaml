suite: tor-obfs4-bridge statefulset
templates:
  - statefulset.yaml
release:
  name: my-bridge
  namespace: test-ns
# config.email is required by the hard-fail guard in statefulset.yaml.
# All tests in this suite must supply it via set: or a global values file.
set:
  config.email: test@example.org
tests:
  - it: renders a StatefulSet with the expected fullname
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: my-bridge-tor-obfs4-bridge
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: tor-obfs4-bridge

  - it: uses the chart appVersion as default image tag
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "ghcr.io/zetneteork/docker-tor-obfs4-bridge:0\\.4\\.9\\.12"

  - it: honours an explicit image tag override
    set:
      image.tag: "custom-tag-1.2.3"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/zetneteork/docker-tor-obfs4-bridge:custom-tag-1.2.3

  - it: sets OR_PORT env var from config.orPort
    set:
      config.orPort: 9001
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OR_PORT
            value: "9001"

  - it: sets PT_PORT env var from config.ptPort
    set:
      config.ptPort: 9002
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PT_PORT
            value: "9002"

  - it: sets EMAIL env var from config.email
    set:
      config.email: test@example.org
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL
            value: test@example.org

  - it: sets TOR_OR_PORT_IPV4 to 1 by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOR_OR_PORT_IPV4
            value: "1"

  - it: exposes orport and ptport container ports
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: orport
            containerPort: 2123
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: ptport
            containerPort: 2133
            protocol: TCP

  # ---------------------------------------------------------------------------
  # Security context – regression guard for the Kubernetes UID/GID bug
  #
  # debian-tor in the official Debian tor package is uid=100 / gid=101.
  # /etc/tor is owned by uid 100 (mode 755). Running as uid 101 (the gid,
  # not the uid) causes: start-tor.sh: /etc/tor/torrc: Permission denied
  #
  # These tests will FAIL if someone accidentally reintroduces runAsUser: 101,
  # preventing the regression from shipping silently.
  # ---------------------------------------------------------------------------

  - it: "security: runAsNonRoot is true (never runs as root)"
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: "security: runAsUser is 100 (debian-tor uid, NOT 101)"
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 100

  - it: "security: runAsGroup is 101 (debian-tor gid)"
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 101

  - it: "security: fsGroup is 101 (debian-tor gid for PVC ownership)"
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 101

  - it: "security: seccompProfile is RuntimeDefault"
    asserts:
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: "security: allowPrivilegeEscalation is false"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: "security: drops all capabilities"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: ALL

  - it: "security: adds only NET_BIND_SERVICE capability (for obfs4proxy)"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.add[0]
          value: NET_BIND_SERVICE

  - it: creates a volumeClaimTemplate when persistence is enabled
    asserts:
      - isNotNull:
          path: spec.volumeClaimTemplates
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: datadir
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 2Gi

  - it: uses emptyDir for datadir when persistence is disabled
    set:
      persistence.enabled: false
    asserts:
      - isNull:
          path: spec.volumeClaimTemplates
      - contains:
          path: spec.template.spec.volumes
          content:
            name: datadir
            emptyDir: {}

  - it: uses an existing PVC when existingClaim is set
    set:
      persistence.existingClaim: my-existing-pvc
    asserts:
      - isNull:
          path: spec.volumeClaimTemplates
      - contains:
          path: spec.template.spec.volumes
          content:
            name: datadir
            persistentVolumeClaim:
              claimName: my-existing-pvc
