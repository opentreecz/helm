apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openrepo.secretName" . }}
  labels:
    {{- include "openrepo.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.openrepo.existingSecret }}
  secret-key: {{ include "openrepo.secretValue" (dict "ctx" . "key" "secret-key" "value" .Values.openrepo.secretKey "length" 50) | b64enc | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  postgres-password: {{ include "openrepo.secretValue" (dict "ctx" . "key" "postgres-password" "value" .Values.postgresql.auth.password "length" 32) | b64enc | quote }}
  {{- else if not .Values.externalDatabase.existingSecret }}
  postgres-password: {{ required "externalDatabase.password or externalDatabase.existingSecret is required when postgresql.enabled=false" .Values.externalDatabase.password | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.redis.enabled) (not .Values.externalRedis.existingSecret) }}
  redis-url: {{ required "externalRedis.url or externalRedis.existingSecret is required when redis.enabled=false" .Values.externalRedis.url | b64enc | quote }}
  {{- end }}
  {{- if and .Values.superuser.create (not .Values.superuser.existingSecret) }}
  superuser-password: {{ include "openrepo.secretValue" (dict "ctx" . "key" "superuser-password" "value" .Values.superuser.password "length" 24) | b64enc | quote }}
  {{- end }}
