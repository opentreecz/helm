apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openrepo.fullname" . }}
  labels:
    {{- include "openrepo.componentLabels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  # nginx, django and the worker share one ReadWriteOnce data volume, so the
  # app runs as a single pod that is replaced (not rolled) on upgrade.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "openrepo.componentSelectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/nginx: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
        checksum/secret: {{ include "openrepo.secretChecksum" . }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "openrepo.componentLabels" (dict "ctx" . "component" "web") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openrepo.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: nginx
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "openrepo.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["nginx"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.nginx.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nginx.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/openrepo
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
        - name: django
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "openrepo.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["run_openrepoweb"]
          env:
            {{- include "openrepo.env" . | nindent 12 }}
          ports:
            - name: django
              containerPort: 8000
              protocol: TCP
          {{- with .Values.django.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.django.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.django.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.django.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/openrepo
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        - name: worker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "openrepo.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app/django
          command:
            - sh
            - -c
            - exec celery -A openrepo worker -l "$OPENREPO_LOGLEVEL" --concurrency="$OPENREPO_WORKER_CONCURRENCY"
          env:
            {{- include "openrepo.env" . | nindent 12 }}
            - name: OPENREPO_WORKER_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
          {{- with .Values.worker.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/openrepo
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "openrepo.fullname" .)) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: nginx-config
          configMap:
            name: {{ include "openrepo.fullname" . }}-nginx
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
