{{- if .Values.superuser.create }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openrepo.fullname" . }}-superuser
  labels:
    {{- include "openrepo.componentLabels" (dict "ctx" . "component" "superuser") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "openrepo.componentLabels" (dict "ctx" . "component" "superuser") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openrepo.serviceAccountName" . }}
      containers:
        - name: superuser
          image: {{ include "openrepo.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app/django
          command:
            - sh
            - -c
            - |
              set -e
              # Wait until the django container has applied all migrations.
              until ./manage.py migrate --check >/dev/null 2>&1; do
                echo "Waiting for database migrations..."
                sleep 5
              done
              ./manage.py shell -c '
              import os
              from django.contrib.auth import get_user_model
              User = get_user_model()
              name = os.environ["DJANGO_SUPERUSER_USERNAME"]
              if User.objects.filter(username=name).exists():
                  print(f"Superuser {name} already exists")
              else:
                  User.objects.create_superuser(name, os.environ["DJANGO_SUPERUSER_EMAIL"], os.environ["DJANGO_SUPERUSER_PASSWORD"])
                  print(f"Created superuser {name}")
              '
          env:
            {{- include "openrepo.env" . | nindent 12 }}
            - name: DJANGO_SUPERUSER_USERNAME
              value: {{ .Values.superuser.username | quote }}
            - name: DJANGO_SUPERUSER_EMAIL
              value: {{ .Values.superuser.email | quote }}
            - name: DJANGO_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "openrepo.secretName" .) .Values.superuser.existingSecret }}
                  key: {{ ternary .Values.superuser.existingSecretPasswordKey "superuser-password" (not (empty .Values.superuser.existingSecret)) }}
{{- end }}
