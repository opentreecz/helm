apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openrepo.fullname" . }}-nginx
  labels:
    {{- include "openrepo.labels" . | nindent 4 }}
data:
  # Based on deploy/nginx/nginx.conf.prod from the OpenRepo image; the upstream
  # points at the django container in the same pod.
  nginx.conf: |
    user www-data;
    worker_processes auto;
    pid /run/nginx.pid;
    daemon off;

    events {
        worker_connections 1024;
    }

    http {
        upstream django {
            server 127.0.0.1:8000;
            keepalive 32;
        }

        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        sendfile on;
        tcp_nopush on;
        types_hash_max_size 2048;
        keepalive_timeout  65;
        access_log off;

        server {
            client_max_body_size {{ div (int64 .Values.openrepo.maxUploadSize) 1048576 | max 1 }}M;
            client_body_buffer_size 64k;

            listen 8080 default_server;
            server_name _;

            charset utf-8;
            index   index.html index.htm;

            location = /health/ {
                return 200;
            }

            location = / {
                root /app/frontend-dist;
                try_files $uri $uri/ /index.html;
            }
            location ~ ^(/index.html|/assets/|/cfg/|/favicon.ico) {
                root /app/frontend-dist;
                try_files $uri $uri/ /index.html;
            }

            location ~ ^/static/ {
                root /app/django/;
            }

            location ~ ^(/api/|/api-auth/|/back|/static/|/admin/) {
                proxy_pass_header Server;
                proxy_set_header Host $http_host;
                proxy_redirect off;
                proxy_set_header X-Forwarded-For  $http_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
                proxy_set_header X-Scheme $http_x_forwarded_proto;
                proxy_connect_timeout 120;
                proxy_read_timeout 120;
                proxy_send_timeout 120;
                proxy_http_version 1.1;
                proxy_pass http://django;
            }

            location ~ ^/ {
                autoindex on;
                absolute_redirect off;
                root /var/lib/openrepo/www/;
            }
        }
    }
