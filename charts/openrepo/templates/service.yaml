apiVersion: v1
kind: Service
metadata:
  name: {{ include "openrepo.fullname" . }}
  labels:
    {{- include "openrepo.componentLabels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "openrepo.componentSelectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
