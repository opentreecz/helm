apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "openrepo.fullname" . }}-test-connection"
  labels:
    {{- include "openrepo.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-qO-', 'http://{{ include "openrepo.fullname" . }}:{{ .Values.service.port }}/api/health/']
  restartPolicy: Never
