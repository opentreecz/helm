suite: wireguard service
templates:
  - service.yaml
release:
  name: my-wg
  namespace: test-ns
set:
  wireguard:
    server:
      enabled: true
      storage:
        storageClass: "standard"
tests:
  - it: renders a Service when server is enabled
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: my-wg-wireguard

  - it: defaults to NodePort service type
    asserts:
      - equal:
          path: spec.type
          value: NodePort

  - it: honours ClusterIP override
    set:
      service.type: ClusterIP
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
