suite: wireguard deployment
templates:
  - deployment.yaml
release:
  name: my-wg
  namespace: test-ns
tests:
  - it: renders a Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: my-wg-wireguard

  - it: has correct selector labels
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: wireguard

  - it: uses the linuxserver/wireguard image
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "linuxserver/wireguard"

  - it: honours fullnameOverride
    set:
      fullnameOverride: custom-wg
    asserts:
      - equal:
          path: metadata.name
          value: custom-wg
