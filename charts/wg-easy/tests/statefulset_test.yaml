suite: wg-easy statefulset
templates:
  - statefulset.yaml
release:
  name: my-wg-easy
  namespace: test-ns
tests:
  - it: renders a StatefulSet
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: my-wg-easy

  - it: has correct selector labels
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: wg-easy

  - it: uses the chart appVersion as default image tag
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "wg-easy:15\\.2\\.2"

  - it: honours image tag override
    set:
      image:
        tag: "custom-tag"
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "custom-tag"
