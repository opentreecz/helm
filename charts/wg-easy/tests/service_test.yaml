suite: wg-easy service
templates:
  - service.yaml
release:
  name: my-wg-easy
  namespace: test-ns
tests:
  - it: renders two Services (UI and WireGuard)
    asserts:
      - hasDocuments:
          count: 2

  - it: first document is the UI service
    documentIndex: 0
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: my-wg-easy-ui

  - it: second document is the WireGuard UDP service
    documentIndex: 1
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: my-wg-easy-wireguard
