suite: rcon-web-admin deployment
templates:
  - deployment.yaml
release:
  name: my-rcon
  namespace: test-ns
tests:
  - it: renders a Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: my-rcon-rcon-web-admin

  - it: uses the itzg/rcon image
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "itzg/rcon"

  - it: has correct selector labels
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: rcon-web-admin
