{{- if not .Values.openrepo.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openrepo-sync.secretName" . }}
  labels:
    {{- include "openrepo-sync.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.openrepo.existingSecretKey }}: {{ required "openrepo.apiKey is required (or set openrepo.existingSecret)" .Values.openrepo.apiKey | b64enc | quote }}
{{- end }}
