suite: minecraft deployment
templates:
  - deployment.yaml
release:
  name: my-mc
  namespace: test-ns
set:
  minecraftServer:
    eula: "TRUE"
tests:
  - it: renders a Deployment by default
    asserts:
      - isKind:
          of: Deployment

  - it: has correct resource name
    asserts:
      - equal:
          path: metadata.name
          value: my-mc-minecraft

  - it: uses the itzg/minecraft-server image
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "itzg/minecraft-server"

  - it: renders as StatefulSet when workloadAsStatefulSet is true
    set:
      workloadAsStatefulSet: true
    asserts:
      - isKind:
          of: StatefulSet
