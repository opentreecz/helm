name: Scheduled Build

# Regularly verify that every chart still lints, templates, packages, and
# passes unit tests with the latest Helm, independent of PR activity.
# Catches drift caused by Helm releases or upstream API changes.
on:
  schedule:
    # 06:00 UTC every Monday
    - cron: '0 6 * * 1'
  workflow_dispatch:

# The scheduled build only reads the repository and uploads an artifact.
permissions:
  contents: read

jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.2

      - name: Lint, template and package all charts
        run: |
          set -euo pipefail
          mkdir -p .cr-release-packages
          failed=0
          for chart in charts/*/; do
            [[ -f "${chart}Chart.yaml" ]] || continue
            echo "::group::${chart}"
            helm dependency update "$chart" || true
            # Use ci/ct-values.yaml if present to supply required values during lint.
            lint_args=()
            if [[ -f "${chart}ci/ct-values.yaml" ]]; then
              lint_args+=(-f "${chart}ci/ct-values.yaml")
            fi
            if ! helm lint "$chart" "${lint_args[@]}"; then failed=1; fi
            if ! helm template release "$chart" "${lint_args[@]}" >/dev/null; then failed=1; fi
            if ! helm package "$chart" --destination .cr-release-packages >/dev/null; then failed=1; fi
            echo "::endgroup::"
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "One or more charts failed to build." >&2
            exit 1
          fi

      - name: Upload packaged charts
        uses: actions/upload-artifact@v7
        with:
          name: packaged-charts
          path: .cr-release-packages/*.tgz
          if-no-files-found: warn
          retention-days: 7

  unit-test-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        # helm-unittest v1.1.x uses the `platformHooks` plugin field, which
        # requires Helm >= 3.18; keep this pin at 3.18+ to load the plugin.
        uses: azure/setup-helm@v5
        with:
          version: v3.21.2

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.1

      - name: Run helm unit tests for all charts
        run: |
          set -euo pipefail
          ran=0
          failed=0
          for chart in charts/*/; do
            [[ -f "${chart}Chart.yaml" ]] || continue
            if [ -d "${chart}tests" ]; then
              echo "::group::unittest ${chart}"
              if ! helm unittest "$chart"; then failed=1; fi
              echo "::endgroup::"
              ran=1
            fi
          done
          if [ "$ran" -eq 0 ]; then
            echo "No chart unit tests found."
          fi
          if [[ "$failed" -ne 0 ]]; then
            echo "One or more chart unit test suites failed." >&2
            exit 1
          fi
